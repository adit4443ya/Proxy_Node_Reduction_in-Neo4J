version: '3.8'

services:
  shard1:
    image: neo4j:5.15.0-enterprise
    container_name: neo4j-shard1
    ports:
      - "7474:7474"    # HTTP
      - "7687:7687"    # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_ssl_policy_bolt_enabled=false
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_memory_transaction_total_max=512m
      # - NEO4J_fabric_connection_ssl_enforced=false
    volumes:
      - ./data/shard1:/data
      - ./logs/shard1:/logs
    networks:
      - neo4j-network

  shard2:
    image: neo4j:5.15.0-enterprise
    container_name: neo4j-shard2
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_ssl_policy_bolt_enabled=false
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      # - NEO4J_fabric_connection_ssl_enforced=false
    volumes:
      - ./data/shard2:/data
      - ./logs/shard2:/logs
    networks:
      - neo4j-network

  shard3:
    image: neo4j:5.15.0-enterprise
    container_name: neo4j-shard3
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_ssl_policy_bolt_enabled=false
      # - NEO4J_fabric_connection_ssl_enforced=false
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - ./data/shard3:/data
      - ./logs/shard3:/logs
    networks:
      - neo4j-network

networks:
  neo4j-network:
    driver: bridge