version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0-enterprise
    container_name: neo4j-multi-db
    ports:
      - "7474:7474"    # HTTP
      - "7687:7687"    # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      # Enable multiple databases
      - NEO4J_dbms_default__database=neo4j
      # Memory settings
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_dbms_memory_transaction_total_max=1G
    volumes:
      - ./data:/data
      - ./logs:/logs
    networks:
      - neo4j-network

networks:
  neo4j-network:
    driver: bridge